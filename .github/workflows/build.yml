name: ASP.NET Core CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install AdminLTE, Bootstrap and HTMX assets
        run: bash tools/setup-assets.sh
      - name: Restore solution
        run: dotnet restore src/PeopleHub/PeopleHub.csproj
      - name: Build application and Razor views
        run: dotnet build src/PeopleHub/PeopleHub.csproj --no-restore --configuration Release
      - name: Run tests
        run: dotnet test tests/PeopleHub.Tests/PeopleHub.Tests.csproj --configuration Release
